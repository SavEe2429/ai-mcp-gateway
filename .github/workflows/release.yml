name: Automated Release Orchestration

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (SemVer without v, e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare-python:
    name: Verify & Build Python Distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      date: ${{ steps.semver.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse SemVer release version
        id: semver
        uses: ./.github/actions/parse-release-version
        with:
          branch_name: ${{ github.ref }}
          version_input: ${{ inputs.version }}

      - name: Install uv & Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Verify Quality Gate (Lint & Tests)
        run: |
          uv run ruff check src/ tests/ packaging/ templates/ .github/scripts/release/
          uv run pytest

      - name: Sync Package Version & Promote Changelog
        run: |
          chmod +x .github/scripts/release/*.sh
          uv run python .github/scripts/release/release_ops.py sync-pyproject "${{ steps.semver.outputs.version }}"
          ./.github/scripts/release/update-changelog-file.sh "${{ steps.semver.outputs.version }}" "${{ steps.semver.outputs.date }}"
          ./.github/scripts/release/generate-release-notes-file.sh "${{ steps.semver.outputs.version }}"
          ./.github/scripts/release/update-release-notes-index.sh "${{ steps.semver.outputs.version }}" "${{ steps.semver.outputs.date }}"

      - name: Build Python Wheel & Source Dist
        run: |
          mkdir -p dist
          uv build --out-dir dist/

      - name: Upload Python Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            pyproject.toml
            CHANGELOG.md
            Docs/public/release-notes/

  build-windows-exe:
    name: Build Windows Bundle (onedir)
    needs: prepare-python
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv & Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Build Windows Directory Bundle (onedir)
        shell: pwsh
        run: |
          uv run python packaging/build.py --mode onedir
          if (-not (Test-Path "out/ai-mcp-gateway/ai-mcp-gateway/ai-mcp-gateway.exe")) {
            throw "Windows executable build output missing"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "out/ai-mcp-gateway/ai-mcp-gateway/*" -DestinationPath "dist/ai-mcp-gateway-windows-x64.zip" -Force
          Get-Item "dist/ai-mcp-gateway-windows-x64.zip" | Select-Object Name, Length

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: dist/ai-mcp-gateway-windows-x64.zip

  publish:
    name: Publish GitHub Release
    needs: [prepare-python, build-windows-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Python Artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: downloaded-python

      - name: Download Windows Bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-bundle
          path: dist

      - name: Assemble Release Assets & Checksums
        run: |
          mkdir -p dist Docs/public/release-notes
          find downloaded-python -maxdepth 2 \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          cp downloaded-python/pyproject.toml pyproject.toml
          cp downloaded-python/CHANGELOG.md CHANGELOG.md
          cp -r downloaded-python/Docs/public/release-notes/* Docs/public/release-notes/
          (cd dist && rm -f SHA256SUMS.txt && sha256sum *.whl *.tar.gz *.zip > SHA256SUMS.txt)
          chmod +x .github/scripts/release/*.sh
          ./.github/scripts/release/build-github-release-body.sh \
            "${{ needs.prepare-python.outputs.version }}" \
            "Docs/public/release-notes/v${{ needs.prepare-python.outputs.version }}.md" \
            "dist/SHA256SUMS.txt" \
            "dist/RELEASE_BODY.md"

      - name: Commit and Push Release Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md Docs/public/release-notes/
          git commit -m "chore(release): promote v${{ needs.prepare-python.outputs.version }} [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Create Immutable Git Tag
        run: |
          git tag -fa "${{ needs.prepare-python.outputs.tag }}" -m "Release ${{ needs.prepare-python.outputs.tag }}"
          git push origin "${{ needs.prepare-python.outputs.tag }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-python.outputs.tag }}
          name: "Release ${{ needs.prepare-python.outputs.tag }}"
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Default Branch and Delete Release Branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-edit "${{ needs.prepare-python.outputs.tag }}" -m "chore(release): merge ${{ needs.prepare-python.outputs.tag }} [skip ci]"
          if git push origin main; then
            git push origin --delete "${{ github.ref_name }}" || true
          else
            echo "Notice: Direct push to main was blocked (branch protection). Keeping '${{ github.ref_name }}' for PR merge."
          fi
