name: Feature Request
description: Propose a new feature, MCP tool, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What capability or improvement would you like to see?
      placeholder: Describe the feature clearly...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or use case
      description: Why is this feature useful for MCP workflows or local AI agents?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: Share API shapes, config options, or UI ideas if you have them.
